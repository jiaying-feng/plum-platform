<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>青梅农旅 · 消费者站</title>
<link rel="stylesheet" href="/web/common.css" />
<link rel="stylesheet" href="/web/pc.css" />
<style>
  .ai-fab { position: fixed; right: 26px; bottom: 26px; z-index: 40; border: none;
    background: var(--green-dark); color: #fff; border-radius: 28px; padding: 12px 20px;
    font-size: 14px; box-shadow: 0 6px 20px rgba(38, 51, 43, .25); cursor: pointer; }
  .ai-fab:hover { background: var(--green); }
  .ai-q { background: #fff; border: 1px solid var(--line); border-radius: var(--r);
    padding: 12px 14px; margin-bottom: 12px; font-size: 13px; white-space: pre-wrap; }
  .ai-q.me { background: var(--green-soft); border-color: #d5e8d5; }
  .ai-quick { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .ai-quick .btn { font-size: 12px; padding: 5px 10px; }
  .hero-banner { position: relative; border-radius: var(--r); overflow: hidden; }
  .hero-banner .img { height: 320px; }
  .hero-banner .txt { position: absolute; left: 32px; bottom: 28px; color: #fff;
    text-shadow: 0 2px 12px rgba(0,0,0,.55); }
  .hero-banner .txt h2 { font-size: 30px; }
  .spot-map { position: relative; height: 300px; border-radius: var(--r); overflow: hidden;
    background: linear-gradient(160deg, #e6f0e2, #f2f6ec 55%, #dfeade); border: 1px solid var(--line); }
  .spot-map .road { position: absolute; left: 5%; top: 48%; width: 90%; height: 10px;
    background: #f7f4e8; border-radius: 10px; transform: rotate(-7deg); }
  .spot-map .pin { position: absolute; transform: translate(-50%, -100%); text-align: center; }
  .spot-map .pin i { display: block; width: 34px; height: 34px; line-height: 34px; border-radius: 50%;
    background: var(--green); color: #fff; font-size: 12px; font-style: normal; font-weight: 700;
    border: 3px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.16); }
  .spot-map .pin.done i { background: var(--gold); }
  .spot-map .pin span { display: block; font-size: 11px; margin-top: 4px; white-space: nowrap; }
  .checkout-layout { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 991px) { .checkout-layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<header class="pc-topbar">
  <div class="pc-container">
    <a class="pc-logo" href="#/home">䢺江青梅</a>
    <div class="pc-search">
      <input class="input" id="globalSearch" placeholder="搜园子、好物、课程、民宿…" aria-label="全站搜索" />
      <button class="btn" id="searchBtn">搜索</button>
    </div>
    <div class="pc-top-actions">
      <a class="btn btn-sm" href="#/cart">购物车 <b id="cartCount">0</b></a>
      <a class="btn btn-sm" href="#/mine">我的</a>
      <button class="btn btn-sm" id="accountBtn">登录</button>
      <a class="btn btn-sm" href="/">返回门户</a>
    </div>
  </div>
</header>

<nav class="pc-topnav">
  <div class="pc-container" id="nav">
    <a href="#/home" data-nav="home">首页</a>
    <a href="#/orchards" data-nav="orchards">采摘园区</a>
    <a href="#/research" data-nav="research">研学课程</a>
    <a href="#/homestays" data-nav="homestays">民宿住宿</a>
    <a href="#/shop" data-nav="shop">青梅好物</a>
    <a href="#/festivals" data-nav="festivals">节庆活动</a>
    <a href="#/checkin" data-nav="checkin">集章地图</a>
  </div>
</nav>

<main class="pc-site-main">
  <div class="mobile-tip">当前是桌面版消费者站。手机上用会更顺手：<a href="/visitor">打开游客 H5</a>。</div>
  <div id="app"><div class="loading">正在把镇上的东西端上来…</div></div>
</main>

<button class="ai-fab" id="aiFab" aria-label="打开问小梅">问小梅</button>

<script src="/web/common.js"></script>
<script src="/web/map.js"></script>
<script src="/web/pc.js"></script>
<script src="/web/consumer.js"></script>
</body>
</html>
